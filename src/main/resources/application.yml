spring:
  application:
    name: travel-photo

  datasource:
    url: ${DB_URL:jdbc:mysql://100.121.122.102:3306/photo_trip?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234567890}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate     # BẮT BUỘC — Flyway là nguồn sự thật duy nhất cho schema (SEC-09)
    open-in-view: false
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
           # user-info-uri: https://www.gooleapis.com/oauth2/v3/userinfo
            scope: [email, profile]

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 500MB   # tối đa 100 file x 50MB; thực tế web upload từng file (Cloudflare giới hạn ~100MB/request)

server:
  forward-headers-strategy: native   # hiểu đúng X-Forwarded-For từ Nginx (SEC-06/SEC-08)
  port: ${SERVER_PORT:8310}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
jwt:
  secret: ${JWT_SECRET}
  access-exp-ms: 1800000       # 30 phút
  refresh-exp-ms: 604800000    # 7 ngày

storage:
  # Dev (chạy local, không Docker): trỏ thẳng 1 thư mục Windows qua STORAGE_ROOT_PATH
  # trong .env.development (vd D:/My Project/tripTravel/photo).
  # Production (Docker trên Ubuntu): STORAGE_ROOT_PATH ở đây LUÔN là đường dẫn
  # BÊN TRONG container (/data/photo-storage) — docker-compose.yml đã ép cứng
  # giá trị này trong `environment:`. Đường dẫn THẬT trên host server dùng biến
  # riêng STORAGE_HOST_PATH, chỉ dùng ở vế trái `volumes:` trong docker-compose.yml,
  # không lộ vào bên trong container.
  root-path: ${STORAGE_ROOT_PATH:/data/photo-storage}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8300}
  api-base-url: ${API_BASE_URL:http://localhost:8310}
  cookie-secure: ${COOKIE_SECURE:true}
  dev-login-enabled: ${DEV_LOGIN_ENABLED:false}   # mặc định FALSE
  dev-login-secret: ${DEV_LOGIN_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
    env:
      enabled: false
    mappings:
      enabled: false
    heapdump:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
google:

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 300MB

vnpay:
  tmn-code: "YOUR_TMN_CODE"          # Mã website merchant, VNPay cấp khi đăng ký
  hash-secret: "YOUR_HASH_SECRET"    # Secret key merchant — tuyệt đối không lộ ra frontend/git
  pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"  # Production: https://vnpayment.vn/paymentv2/vpcpay.html
  return-url: "http://localhost:5173/payment/vnpay-return"       # Trang FE nhận kết quả, đổi thành domain thật lúc deploy